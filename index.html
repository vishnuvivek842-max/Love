<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ To My Love ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffe6ec,#fff5f8);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:#fff;
    max-width:600px;
    width:100%;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    padding:25px;
    text-align:center;
}

h1{
    color:#e91e63;
    margin-bottom:20px;
}

img{
    width:100%;
    max-width:350px;
    border-radius:15px;
    border:5px solid #ffb6c1;
    margin-bottom:20px;
}

p{
    font-size:18px;
    line-height:1.7;
    color:#333;
    margin-bottom:15px;
}

.highlight{
    color:#d81b60;
    font-weight:bold;
    font-size:22px;
}

.footer{
    font-weight:bold;
    color:#e91e63;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="card">

<h1>❤️ To My Love ❤️</h1>

<img src="photo.png" alt="Our Photo">

<p><b>Hey Kutty,</b></p>

<p>
If you're reading this, it means you found my little surprise. 💖<br><br>

Every day with you feels special.<br>

Your smile makes my world brighter. 🌸
</p>

<p class="highlight">
I LOVE YOU MORE THAN WORDS CAN SAY. ❤️
</p>

<p>
No matter what happens,<br>
I'll always be there for you.
</p>

<p class="footer">
Forever &amp; Always,<br>
Your Macha ❤️
</p>

</div>

</body>
</html>
